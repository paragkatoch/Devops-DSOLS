services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672" # optional (keep for debugging)
      - "15672:15672" # UI
    command: >
      bash -c "
      rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: retail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # optional (remove later in prod)

  postgres-setup:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["./app", "-type=init", "-config=config/local.yml"]
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  user-controller:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["./app", "-type=controller", "-component=user", "-config=config/local.yml"]
    depends_on:
      postgres:
        condition: service_started
      postgres-setup:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  product-controller:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["./app", "-type=controller", "-component=product", "-config=config/local.yml"]
    depends_on:
      postgres:
        condition: service_started
      postgres-setup:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["./app", "-type=service", "-component=user", "-config=config/local.yml"]
    depends_on:
      postgres:
        condition: service_started
      postgres-setup:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["./app", "-type=service", "-component=product", "-config=config/local.yml"]
    depends_on:
      postgres:
        condition: service_started
      postgres-setup:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus # 👈 ADD THIS
    command:
      - "--web.enable-remote-write-receiver"
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus" # 👈 ADD THIS
    ports:
      - "9090:9090"
    depends_on:
      - user-controller
      - product-controller

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  # (later) order-service
  # order-service:
  #   build:
  # context: .
  # dockerfile: infra/Dockerfile
  #   command: ["./app", "-type=controller", "-component=order"]

  api-gateway:
    image: nginx:latest
    container_name: api-gateway
    ports:
      - "9000:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - product-service

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
