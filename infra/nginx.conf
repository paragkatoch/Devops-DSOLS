worker_processes auto;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  keepalive_timeout 300s;
  keepalive_requests 100000;
  
  resolver 127.0.0.11:53 valid=10s;
  resolver_timeout 5s;

  upstream product_controller {
    server product-controller:9000;
  }

  upstream user_controller {
    server user-controller:9000;
  }

  server {
    listen 80;

    location /api/user {
      proxy_http_version 1.1;
      proxy_set_header Connection "close";
      proxy_pass http://user-controller;
    }

    location /api/product {
      proxy_http_version 1.1;
      proxy_set_header Connection "close";
      proxy_pass http://product-controller;
    }
  }
# }


