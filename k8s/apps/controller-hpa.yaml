apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: product-controller-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-controller

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 10 # Reduced from 300
      policies:
        - type: Percent
          value: 100 # Can remove all pods that are not needed at once
          periodSeconds: 5
      selectPolicy: Max
---
