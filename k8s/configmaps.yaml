apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  local.yml: |
    env: "local"
    databases:
      order: "postgres://postgres:password@order-postgres:5432/order_db?sslmode=disable"
      product: "postgres://postgres:password@product-postgres:5432/product_db?sslmode=disable"
      user: "postgres://postgres:password@user-postgres:5432/user_db?sslmode=disable"
    queue_path: "amqp://guest:guest@rabbitmq:5672/"
    http_server:
      address: ":9000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "controllers"
        static_configs:
          - targets:
              - user-controller:9000
              - product-controller:9000
              - order-controller:9000
      - job_name: "services"
        static_configs:
          - targets:
              - product-service:9000
              - user-service:9000
              - order-service:9000
      - job_name: "rabbitmq"
        static_configs:
          - targets: ["rabbitmq:15692"]
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.devops-dsols.svc.cluster.local:8080']
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        kubernetes_sd_configs:
          - role: node

        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
