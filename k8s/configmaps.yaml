# app-config is now a Kubernetes Secret created by k8s/vault-init.sh.
# Vault stores the DSNs; vault-init.sh renders them into a K8s Secret
# named "app-config" with key "local.yml" — same name/key so app pods
# (user/product/order) mount it identically, just via secret: instead of configMap:.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "controllers"
        static_configs:
          - targets:
              - user-controller:9000
              - product-controller:9000
              - order-controller:9000
      - job_name: "services"
        static_configs:
          - targets:
              - product-service:9000
              - user-service:9000
              - order-service:9000
      - job_name: "rabbitmq"
        static_configs:
          - targets: ["rabbitmq:15692"]
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.devops-dsols.svc.cluster.local:8080']
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        kubernetes_sd_configs:
          - role: node

        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
