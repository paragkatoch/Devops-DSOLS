apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  local.yml: |
    env: "local"
    databases:
      order: "postgres://postgres:password@order-postgres:5432/order_db?sslmode=disable"
      product: "postgres://postgres:password@product-postgres:5432/product_db?sslmode=disable"
      user: "postgres://postgres:password@user-postgres:5432/user_db?sslmode=disable"
    queue_path: "amqp://guest:guest@rabbitmq:5672/"
    http_server:
      address: ":9000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "controllers"
        static_configs:
          - targets:
              - user-controller:9000
              - product-controller:9000
      - job_name: "services"
        static_configs:
          - targets:
              - product-service:9000
              - user-service:9000
      - job_name: "rabbitmq"
        static_configs:
          - targets: ["rabbitmq:15692"]
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.devops-dsols.svc.cluster.local:8080']
